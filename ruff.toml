lint.ignore = [
    "builtin-variable-shadowing",
    "builtin-import-shadowing",
    "unnecessary-map",
    "complex-structure",
    "missing-trailing-comma",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "non-imperative-mood",
    "line-too-long",
    "line-contains-todo",
    "pandas-use-of-dot-is-null",
    "import-outside-top-level",
    "compare-to-empty-string",
    "unnecessary-dunder-call",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "magic-value-comparison",
    "assert",
    "exec-builtin",
    "suspicious-subprocess-import",
    "hardcoded-sql-expression",
    "private-member-access",
    "print",
    "p-print",
    "runtime-cast-value",
    "missing-todo-author",
    "missing-todo-link",
    "relative-imports",
]
lint.select = ["ALL"]
preview = true
[format]
    docstring-code-format = true
    preview               = true
[lint.pydocstyle]
    convention = "google"
[lint.per-file-ignores]
    "src/belugas/_fns.py" = [
        "builtin-argument-shadowing",
        "any-type",
        "boolean-type-hint-positional-argument",
        "boolean-default-value-positional-argument",
        "too-many-arguments",
        "eq-without-hash",
    ]
    "src/belugas/meta.py" = ["boolean-type-hint-positional-argument"]
    "src/belugas/typing.py" = ["any-type", "undocumented-public-method", "undocumented-magic-method", "bad-dunder-method-name"]
    "t.py" = ["missing-return-type-undocumented-public-function", "undocumented-public-module", "undocumented-public-class", "undocumented-public-function"]
    "tests/*" = ["undocumented-public-module", "undocumented-public-class", "undocumented-public-method", "undocumented-public-function", "undocumented-public-package", "call-datetime-without-tzinfo", "boolean-type-hint-positional-argument"]
[lint.isort]
    combine-as-imports = true
